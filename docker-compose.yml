services:
  db:
    image: postgres:16-alpine
    container_name: afisha_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-afisha_db}
      POSTGRES_USER: ${POSTGRES_USER:-afisha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afisha_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afisha_user} -d ${POSTGRES_DB:-afisha_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afisha_web
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-afisha_user}:${POSTGRES_PASSWORD:-afisha_password}@db:5432/${POSTGRES_DB:-afisha_db}
      - DATABASE_URL_SYNC=postgresql+psycopg://${POSTGRES_USER:-afisha_user}:${POSTGRES_PASSWORD:-afisha_password}@db:5432/${POSTGRES_DB:-afisha_db}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-culture_bashkortostan_2026}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: afisha_bot
    restart: always
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - BACKEND_API_URL=http://web:8000/api/v1
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
